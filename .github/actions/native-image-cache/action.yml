name: Bounded native Docker compiler cache
description: Preserve source downloads and bounded compiler entries without exporting Cargo targets.
inputs:
  architecture:
    description: The native amd64 or arm64 build architecture.
    required: true
outputs:
  scope:
    description: BuildKit layer cache scope, also isolated by the GitHub ref.
    value: kelryvo-native-${{ inputs.architecture }}-v3
runs:
  using: composite
  steps:
    - id: cargo
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: .cache/docker-cargo
        # The compiler cache is capped at 512 MiB. Never export target/:
        # copying full application and generator builds dominates CI teardown.
        key: docker-compiler-${{ inputs.architecture }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'tools/oracle-codegen/Cargo.lock', 'tools/oracle-codegen/src/main.rs', 'Dockerfile', 'rust-toolchain.toml', 'crates/**/Cargo.toml', 'crates/kelryvo-core/src/build_identity.rs') }}-baseline-v1
        restore-keys: |
          docker-compiler-${{ inputs.architecture }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'tools/oracle-codegen/Cargo.lock', 'tools/oracle-codegen/src/main.rs', 'Dockerfile', 'rust-toolchain.toml', 'crates/**/Cargo.toml', 'crates/kelryvo-core/src/build_identity.rs') }}-
          docker-compiler-${{ inputs.architecture }}-
    - uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
      with:
        scratch-dir: .cache/cache-dance
        utility-image: debian:bookworm-slim@sha256:7c7b2c966bc9ee8cedfeef67e0e279108992c77681fa595db4a9d65c06ccc587
        skip-extraction: ${{ steps.cargo.outputs.cache-hit == 'true' }}
        cache-map: |
          {
            ".cache/docker-cargo/compiler": {
              "target": "/opt/kelryvo-sccache",
              "id": "kelryvo-sccache-${{ inputs.architecture }}",
              "sharing": "locked"
            },
            ".cache/docker-cargo/registry": {
              "target": "/opt/cargo/registry",
              "id": "kelryvo-registry-rust-1.99.1",
              "sharing": "locked"
            }
          }
