name: Native Docker dependency and build cache
description: Preserve architecture-specific Cargo cache mounts and image layers.
inputs:
  architecture:
    description: The native amd64 or arm64 build architecture.
    required: true
outputs:
  scope:
    description: BuildKit layer cache scope, also isolated by the GitHub ref.
    value: kelryvo-native-${{ inputs.architecture }}-v2
runs:
  using: composite
  steps:
    - id: cargo
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: .cache/docker-cargo
        # Freeze a dependency baseline instead of copying every native target
        # back out of BuildKit after every application-only source change.
        key: docker-cargo-${{ inputs.architecture }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'Dockerfile', 'rust-toolchain.toml', 'crates/**/Cargo.toml', 'crates/kelryvo-core/src/build_identity.rs') }}-baseline-v1
        restore-keys: |
          docker-cargo-${{ inputs.architecture }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'Dockerfile', 'rust-toolchain.toml', 'crates/**/Cargo.toml', 'crates/kelryvo-core/src/build_identity.rs') }}-
          docker-cargo-${{ inputs.architecture }}-
    - uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
      with:
        scratch-dir: .cache/cache-dance
        utility-image: debian:bookworm-slim@sha256:7c7b2c966bc9ee8cedfeef67e0e279108992c77681fa595db4a9d65c06ccc587
        skip-extraction: ${{ steps.cargo.outputs.cache-hit == 'true' }}
        cache-map: |
          {
            ".cache/docker-cargo/target": {
              "target": "/opt/kelryvo-source/target",
              "id": "kelryvo-native-${{ inputs.architecture }}-rust-1.99.1",
              "sharing": "locked"
            },
            ".cache/docker-cargo/registry": {
              "target": "/opt/cargo/registry",
              "id": "kelryvo-registry-rust-1.99.1",
              "sharing": "locked"
            }
          }
