name: Pinned native Rust and compilation cache
description: Restore public toolchain inputs and Cargo artifacts scoped by GitHub refs.
inputs:
  key:
    description: Separate incompatible job and test-group build graphs.
    required: true
runs:
  using: composite
  steps:
    - id: toolchain
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: |
          ~/.rustup/toolchains/1.99.1-*
          ~/.cache/kelryvo-build-tools/wasm-bindgen-0.2.130
        key: native-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'docs/dependencies/rust-toolchain.json') }}
    - shell: bash
      run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown --no-self-update
    - name: Install the reviewed native WASM bundler without compiling it again
      if: steps.toolchain.outputs.cache-hit != 'true'
      shell: bash
      env:
        WASM_BINDGEN_TARGET: ${{ runner.arch == 'ARM64' && 'aarch64-unknown-linux-musl' || 'x86_64-unknown-linux-musl' }}
        WASM_BINDGEN_SHA256: ${{ runner.arch == 'ARM64' && '99ffc93ce80081b91632e2b539b782821a8f3439ab0fddc645287462b2f55d3d' || '9687f3bb551b9f66f37ed32a40d7913a00f7962db653054e56857bc306c3227f' }}
      run: |
        curl --fail --location --silent --show-error --retry 2 "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.130/wasm-bindgen-0.2.130-$WASM_BINDGEN_TARGET.tar.gz" -o "$RUNNER_TEMP/wasm-bindgen.tar.gz"
        printf '%s  %s\n' "$WASM_BINDGEN_SHA256" "$RUNNER_TEMP/wasm-bindgen.tar.gz" | sha256sum --check --strict
        mkdir -p "$HOME/.cache/kelryvo-build-tools/wasm-bindgen-0.2.130"
        tar -xzf "$RUNNER_TEMP/wasm-bindgen.tar.gz" --strip-components=1 -C "$HOME/.cache/kelryvo-build-tools/wasm-bindgen-0.2.130"
    - shell: bash
      run: printf '%s\n' "$HOME/.cache/kelryvo-build-tools/wasm-bindgen-0.2.130" >> "$GITHUB_PATH"
    - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
      with:
        shared-key: ${{ inputs.key }}
        cache-workspace-crates: 'true'
        cache-all-crates: 'true'
    # GitHub cache visibility isolates branch/PR writes from protected master.
    # Credentials, private PostgreSQL and runtime fixtures are never cached.
