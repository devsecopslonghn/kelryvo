name: Offline WP0 checks

on:
  push:
    branches: [master, cleanup/rust-only-migration]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'

concurrency:
  group: kelryvo-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned native and WASM toolchains
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - name: Native system libraries and private PostgreSQL fixture
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev pkg-config postgresql-16
      - name: Native formatting and lint
        run: |
          cargo fmt --all --check
          rustfmt --edition 2024 --check tests/support/*.rs
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo clippy -p kelryvo-web --target wasm32-unknown-unknown --locked -- -D warnings
      - name: Private PostgreSQL and native compatibility checks
        run: |
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          cargo run --locked -p kelryvo-test-tools --bin kelryvo-test --

  rust-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned native and WASM toolchains
        run: rustup toolchain install 1.99.1 --profile minimal --target wasm32-unknown-unknown
      - name: Native libraries and isolated runtime prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev pkg-config postgresql-16 iproute2 util-linux curl
          cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - name: Native UID, capability, TLS, WASM and metadata smoke
        env:
          KELRYVO_REVISION: ${{ github.sha }}
        run: |
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          cargo run --locked -p kelryvo-test-tools --bin kelryvo-test -- --runtime-only

  rust-image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the native application without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          target: app
          platforms: linux/${{ matrix.arch }}
          build-args: KELRYVO_REVISION=${{ github.sha }}
          tags: kelryvo-rust:candidate
          load: true
          push: false
          provenance: false
          sbom: false
      - name: Build pinned native image checker
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          cargo build --locked -p kelryvo-test-tools
      - name: Build the disposable native inventory probe against the image libc
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: KELRYVO_REVISION=${{ github.sha }}
          target: container-test-tools
          provenance: false
          sbom: false
          outputs: type=local,dest=.cache/native-container-tools
      - name: Verify the exact local native image contract
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          SOURCE_REVISION: ${{ github.sha }}
          KELRYVO_CONTAINER_PROBE: ${{ github.workspace }}/.cache/native-container-tools/kelryvo-container-probe
        run: target/debug/kelryvo-test --container kelryvo-rust:candidate "$TARGET_ARCH" "$SOURCE_REVISION"

  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned repository verification toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Native source, fixed migration contracts and test dependency closure
        run: |
          cargo fetch --locked
          cargo check-delivery
      - name: Verify complete Cargo source archive versions, checksums and licenses
        run: cargo repository dependencies --manifest > /tmp/kelryvo-dependencies.json

      # No credentials, Oracle targets, deployments, release publishing or remote mutations.
