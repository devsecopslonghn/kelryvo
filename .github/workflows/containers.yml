name: Kelryvo OCI verification and publication

on:
  pull_request:
  push:
    branches: [master, cleanup/rust-only-migration]

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '4'

concurrency:
  group: kelryvo-oci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/native-rust
        with:
          key: host-image-${{ matrix.arch }}
      - name: Build the native verifier before configuring or importing any image
        id: source
        run: |
          cargo build -p kelryvo-cli -p kelryvo-test-tools --locked
          cargo test --locked -p kelryvo-test-tools --bins
          native_tree=$(target/debug/kelryvo source-tree-digest)
          printf 'tree=%s\n' "$native_tree" >> "$GITHUB_OUTPUT"
      - name: Enable OCI-preserving local image storage
        run: |
          sudo -n --preserve-env=CI,GITHUB_ACTIONS target/debug/kelryvo-test --configure-ci-docker
          sudo systemctl restart docker
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: ./.github/actions/native-image-cache
        id: image-cache
        with:
          architecture: ${{ matrix.arch }}
      - run: mkdir -p dist/oci
      - name: Build the unified app image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: |
            KELRYVO_REVISION=${{ github.sha }}
            KELRYVO_SOURCE_TREE_DIGEST=${{ steps.source.outputs.tree }}
          target: app
          provenance: false
          sbom: false
          outputs: type=oci,dest=dist/oci/app-${{ matrix.arch }}.tar
          cache-from: type=gha,scope=${{ steps.image-cache.outputs.scope }}
          # GitHub ref isolation prevents a PR cache from becoming master input.
          cache-to: type=gha,scope=${{ steps.image-cache.outputs.scope }},mode=max,ignore-error=true,timeout=1m
      - name: Build the disposable probe against the image's native libc
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: |
            KELRYVO_REVISION=${{ github.sha }}
            KELRYVO_SOURCE_TREE_DIGEST=${{ steps.source.outputs.tree }}
          target: container-test-tools
          provenance: false
          sbom: false
          outputs: type=local,dest=.cache/native-container-tools
          cache-from: type=gha,scope=${{ steps.image-cache.outputs.scope }}
      - name: Smoke-test the exact platform artifacts
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          KELRYVO_CONTAINER_PROBE: ${{ github.workspace }}/.cache/native-container-tools/kelryvo-container-probe
        run: |
          set -euo pipefail
          target/debug/kelryvo oci load-platform "dist/oci/app-$TARGET_ARCH.tar" "$GITHUB_SHA" "$TARGET_ARCH"
          target/debug/kelryvo-test --container kelryvo-app:test "$TARGET_ARCH" "$GITHUB_SHA"
          target/debug/kelryvo-test --containers kelryvo-app:test "$TARGET_ARCH"
      - name: Install the customer Compose pilot and import its mounted repository
        run: target/debug/kelryvo-test --pilot-container kelryvo-app:test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: platform-images-${{ github.sha }}-${{ github.run_attempt }}-${{ matrix.arch }}
          path: dist/oci/*-${{ matrix.arch }}.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

  verify:
    if: always()
    needs: platform
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require both native platform checks
        env:
          PLATFORM_RESULT: ${{ needs.platform.result }}
        run: test "$PLATFORM_RESULT" = success
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/native-rust
        with:
          key: host-image-amd64
      - name: Build the native OCI verifier
        run: cargo build -p kelryvo-cli -p kelryvo-test-tools --locked
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: platform-images-${{ github.sha }}-${{ github.run_attempt }}-*
          path: dist/oci
          merge-multiple: true
      - name: Assemble and verify the OCI index from both tested platforms
        run: target/debug/kelryvo oci assemble dist/oci "$GITHUB_SHA"
      # Export only indexes from a successful trusted master verification.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-images-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/oci/kelryvo-*.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
