name: Kelryvo OCI verification and publication

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: docker build --platform linux/amd64 --build-arg KELRYVO_REVISION="$GITHUB_SHA" --target app --tag kelryvo-app:test .
      - run: docker build --platform linux/amd64 --build-arg KELRYVO_REVISION="$GITHUB_SHA" --target worker --tag kelryvo-worker:test .
      - run: node scripts/test-containers.mjs kelryvo-app:test kelryvo-worker:test

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      checks: read
      security-events: read
      packages: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/container-publication-gate.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: docker build --platform linux/amd64 --build-arg KELRYVO_REVISION="$GITHUB_SHA" --target app --tag kelryvo-app:test .
      - run: docker build --platform linux/amd64 --build-arg KELRYVO_REVISION="$GITHUB_SHA" --target worker --tag kelryvo-worker:test .
      - run: node scripts/test-containers.mjs kelryvo-app:test kelryvo-worker:test
      # Recheck exact master after build and publish only these tested local images.
      - run: node scripts/container-publication-gate.mjs
      - name: Publish immutable source tags and record registry digests
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for image in kelryvo-app kelryvo-worker; do
            reference="ghcr.io/$owner/$image:$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            if docker manifest inspect "$reference" > /dev/null 2>&1; then
              echo "Source tag already exists; preserve the published image and use its recorded digest." >&2
              exit 1
            fi
            docker tag "$image:test" "$reference"
            docker push "$reference"
            docker buildx imagetools inspect "$reference" >> "$GITHUB_STEP_SUMMARY"
          done
          docker logout ghcr.io
