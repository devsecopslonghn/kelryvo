name: Kelryvo OCI verification and publication

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: docker build --platform linux/amd64 --build-arg KELRYVO_REVISION="$GITHUB_SHA" --target app --tag kelryvo-app:test .
      - run: docker build --platform linux/amd64 --build-arg KELRYVO_REVISION="$GITHUB_SHA" --target worker --tag kelryvo-worker:test .
      - run: node scripts/test-containers.mjs kelryvo-app:test kelryvo-worker:test
      # Export only images from a successful trusted master verification.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        name: Save verified images for delivery
        run: docker save kelryvo-app:test kelryvo-worker:test | gzip -1 > verified-images.tar.gz
      - if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-images-${{ github.sha }}-${{ github.run_attempt }}
          path: verified-images.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
