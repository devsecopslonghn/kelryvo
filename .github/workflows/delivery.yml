name: Kelryvo verified GitOps delivery

on:
  workflow_run:
    workflows:
      - Offline WP0 checks
      - Kelryvo OCI verification and publication
      - CodeQL
    types: [completed]
    branches: [master]
  # Recovery only; normal publication follows CI completion without dispatch.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '4'

# Keep the publication and Helm write in the same serialized workflow. Pending
# completion events can coalesce; the last event always rechecks all CI gates.
concurrency:
  group: kelryvo-delivery-master
  cancel-in-progress: false

jobs:
  gate:
    if: >-
      github.repository == 'devsecopslonghn/kelryvo' &&
      vars.KELRYVO_DELIVERY_MODE == 'gitops' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
       (github.event_name == 'workflow_run' &&
        (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'dynamic') &&
        github.event.workflow_run.head_branch == 'master' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: read
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
      sha: ${{ steps.gate.outputs.sha }}
      oci_run: ${{ steps.gate.outputs.oci_run }}
      oci_attempt: ${{ steps.gate.outputs.oci_attempt }}
    steps:
      # workflow_run's github.sha is trusted default-branch code. Do not check
      # out event.head_sha or consume its artifact until all gates pass.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/native-rust
        with:
          key: delivery-gate
      - name: Build the pinned native publication gate
        run: |
          cargo build -p kelryvo-cli --locked
      - id: gate
        run: target/debug/kelryvo delivery gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: read
      packages: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SOURCE_SHA: ${{ needs.gate.outputs.sha }}
      OCI_RUN: ${{ needs.gate.outputs.oci_run }}
      OCI_ATTEMPT: ${{ needs.gate.outputs.oci_attempt }}
    outputs:
      app: ${{ steps.publish.outputs.app }}
      tag: ${{ steps.publish.outputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/native-rust
        with:
          key: delivery-gate
      - name: Build the pinned native publication gate
        run: |
          cargo build -p kelryvo-cli --locked
      - run: target/debug/kelryvo delivery gate --require
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-images-${{ needs.gate.outputs.sha }}-${{ needs.gate.outputs.oci_attempt }}
          run-id: ${{ needs.gate.outputs.oci_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist/oci
      - name: Install OCI transfer tool
        run: sudo apt-get update -qq && sudo apt-get install -y skopeo
      - name: Verify downloaded multi-platform indexes
        run: target/debug/kelryvo oci verify dist/oci/kelryvo-app.tar "$SOURCE_SHA"
      - id: publish
        name: Publish tested images and verify registry digests
        run: target/debug/kelryvo delivery publish

  promote:
    needs: [gate, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: read
      packages: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SOURCE_SHA: ${{ needs.gate.outputs.sha }}
      OCI_RUN: ${{ needs.gate.outputs.oci_run }}
      OCI_ATTEMPT: ${{ needs.gate.outputs.oci_attempt }}
      APP_DIGEST: ${{ needs.publish.outputs.app }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/native-rust
        with:
          key: delivery-tools
      - name: Build the pinned native publication gate and CI tooling
        run: |
          cargo build -p kelryvo-cli -p kelryvo-test-tools --locked
      - name: Check cross-repository credential configuration
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: target/debug/kelryvo-test --ci gitops-credential
      - run: target/debug/kelryvo delivery gate --require
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: devsecopslonghn/kelryvo-helm-chart
          ref: master
          path: helm-chart
          token: ${{ secrets.GITOPS_TOKEN }}
          persist-credentials: false
      - name: Install chart validation tools
        run: target/debug/kelryvo-test --ci install-helm
      - name: Verify registry image, validate chart and promote digest
        run: target/debug/kelryvo delivery promote
        env:
          HELM_TOKEN: ${{ secrets.GITOPS_TOKEN }}
