name: Kelryvo identity integration
on:
  pull_request:
    paths:
      - 'packages/identity/**'
      - 'packages/database/**'
      - 'apps/api/**'
      - 'apps/web/**'
      - 'tests/*identity*'
      - 'tests/helpers/identity-*'
      - 'package*.json'
      - '.github/workflows/identity.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: identity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.10-bookworm@sha256:9b18b78397054fce88a9552e9d5a3ad5bb7fd258c5b3cc1c5028e46373d6ea8f
        env:
          POSTGRES_DB: kelryvo_identity_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SCHEMAFORGE_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/kelryvo_identity_test
      KELRYVO_IDENTITY_INTEGRATION: '1'
      SCHEMAFORGE_JAVA_HOME: ${{ github.workspace }}/.cache/antlr/temurin
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run parser:antlr:prepare
      - run: npm run parser:antlr:build
      - run: npm run build:web
      - run: node --test tests/product-identity.test.mjs tests/product-identity-browser.integration.mjs tests/product-identity-providers.integration.mjs
      - run: npm audit --omit=dev --audit-level=moderate
