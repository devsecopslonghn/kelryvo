name: Offline ANTLR parser acceptance

on:
  schedule:
    - cron: '17 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned native toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Native grammar and retained 31-file corpus
        run: cargo test --locked -p kelryvo-oracle-grammar --test corpus -p kelryvo-parser --test corpus

      # Pure parser checks only; no Oracle, publication or deployment.
