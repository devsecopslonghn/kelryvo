name: Offline ANTLR parser acceptance

on:
  schedule:
    - cron: '17 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SCHEMAFORGE_JAVA_HOME: ${{ github.workspace }}/.cache/antlr/temurin
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: npm run parser:antlr:prepare
      - run: npm run parser:antlr:build
      - run: npm run parser:antlr:corpus
      - run: npm run parser:antlr:test

      # Pure parser checks only: no Oracle credentials, connections, publishing or deployment.
