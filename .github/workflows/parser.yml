name: Offline native parser compatibility

on:
  schedule:
    - cron: '17 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '4'

jobs:
  parser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/native-rust
        with:
          key: parser
      - name: Native grammar, retained corpus and authored compatibility cases
        run: cargo test --locked -p kelryvo-oracle-grammar -p kelryvo-parser

      # Pure parser checks only; no Oracle, publication or deployment.
