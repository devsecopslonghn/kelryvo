name: Kelryvo focused acceptance

on:
  schedule:
    - cron: '47 2 * * 3'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kelryvo-focused-${{ github.ref }}
  cancel-in-progress: true

# Advisory scheduled/manual investigation. This workflow is not a publication
# dependency; failures remain visible without stopping independent delivery.

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      needed: ${{ steps.select.outputs.needed }}
    steps:
      - id: select
        name: Select native security and data-boundary fixtures
        run: echo 'needed=true' >> "$GITHUB_OUTPUT"

  focused:
    needs: changes
    if: needs.changes.outputs.needed == 'true'
    strategy:
      fail-fast: false
      matrix:
        mode: [product-and-json-objects-only, worker-only, recovery-only, local-credentials-only, inventory-only]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned native and WASM toolchains
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - name: Install native test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev pkg-config postgresql-16
      - name: Native PostgreSQL contracts with fixed migration fixtures
        env:
          TEST_MODE: ${{ matrix.mode }}
        run: |
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          bash scripts/test-rust.sh "--$TEST_MODE"

  # Keep failures visible; this scheduled/manual workflow is advisory.
  product:
    if: always()
    needs: [changes, focused]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      FOCUSED_RESULT: ${{ needs.focused.result }}
    steps:
      - run: |
          test "$CHANGES_RESULT" = success
          test "$FOCUSED_RESULT" = success
