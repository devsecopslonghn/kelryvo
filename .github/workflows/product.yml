name: Kelryvo focused acceptance

on:
  schedule:
    - cron: '47 2 * * 3'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '4'

concurrency:
  group: kelryvo-focused-${{ github.ref }}
  cancel-in-progress: true

# Advisory scheduled/manual investigation. This workflow is not a publication
# dependency; failures remain visible without stopping independent delivery.

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        mode: [product-and-json-objects-only, worker-only, recovery-only, local-credentials-only, inventory-only]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/native-rust
        with:
          # Reuse the source group's artifacts instead of storing another
          # complete Cargo target directory for each focused test filter.
          key: source-tests-${{ (matrix.mode == 'worker-only' || matrix.mode == 'recovery-only') && 'worker' || matrix.mode == 'product-and-json-objects-only' && 'server' || 'operator' }}
      - name: Install native test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev pkg-config postgresql-16
      - name: Native PostgreSQL contracts with fixed migration fixtures
        env:
          TEST_MODE: ${{ matrix.mode }}
        run: |
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          cargo run --locked -p kelryvo-test-tools --bin kelryvo-test -- "--$TEST_MODE"

  # Keep failures visible; this scheduled/manual workflow is advisory.
  product:
    if: always()
    needs: focused
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      FOCUSED_RESULT: ${{ needs.focused.result }}
    steps:
      - run: |
          test "$FOCUSED_RESULT" = success
