name: Local PRODUCT acceptance

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: api
            shard: 1/4
          - suite: api
            shard: 2/4
          - suite: api
            shard: 3/4
          - suite: api
            shard: 4/4
          - suite: browser
            shard: 1/3
          - suite: browser
            shard: 2/3
          - suite: browser
            shard: 3/3
          - suite: release
            shard: 1/1
    runs-on: ubuntu-24.04
    # Every deterministic suite partition has its own runner/database; all remain required.
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17.10-bookworm@sha256:9b18b78397054fce88a9552e9d5a3ad5bb7fd258c5b3cc1c5028e46373d6ea8f
        env:
          POSTGRES_DB: schemaforge_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SCHEMAFORGE_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/schemaforge_test
      SCHEMAFORGE_JAVA_HOME: ${{ github.workspace }}/.cache/antlr/temurin
      SCHEMAFORGE_REQUIRE_PRODUCT_TESTS: '1'
      SCHEMAFORGE_TEST_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run parser:antlr:prepare
      # The release suite builds the extracted source itself, after fresh npm ci.
      - if: matrix.suite != 'release'
        run: npm run parser:antlr:build
      - if: matrix.suite != 'release'
        run: npm run build
      - if: matrix.suite == 'api'
        run: npm run test:product
      - if: matrix.suite != 'api'
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - if: matrix.suite == 'browser'
        run: node scripts/test-product.mjs --browser
      - if: always() && matrix.suite == 'browser'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase2-browser-${{ strategy.job-index }}
          path: .cache/phase2-acceptance/
          if-no-files-found: ignore
          retention-days: 14
      - if: matrix.suite == 'release'
        run: npm run test:release

      # Only disposable metadata PostgreSQL and local Git/parser; no Oracle or deployment.

  # Preserve the product check name and fail closed if any suite fails/skips/cancels.
  product:
    if: always()
    needs: acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      ACCEPTANCE_RESULT: ${{ needs.acceptance.result }}
    steps:
      - run: test "$ACCEPTANCE_RESULT" = success
