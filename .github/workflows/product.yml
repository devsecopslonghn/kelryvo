name: Kelryvo focused acceptance

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kelryvo-focused-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      needed: ${{ steps.select.outputs.needed }}
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - id: select
        name: Select affected security and data boundaries
        run: node scripts/ci-focused-tests.mjs
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      - if: steps.select.outputs.needed == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - if: steps.select.outputs.needed == 'true'
        run: npm run build:web
      - if: steps.select.outputs.needed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: focused-web-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/web
          if-no-files-found: error
          retention-days: 1

  focused:
    needs: changes
    if: needs.changes.outputs.needed == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.10-bookworm@sha256:9b18b78397054fce88a9552e9d5a3ad5bb7fd258c5b3cc1c5028e46373d6ea8f
        env:
          POSTGRES_DB: schemaforge_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SCHEMAFORGE_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/schemaforge_test
      SCHEMAFORGE_JAVA_HOME: ${{ github.workspace }}/.cache/antlr/temurin
      SCHEMAFORGE_REQUIRE_PRODUCT_TESTS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: focused-web-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/web
      - run: npm run parser:antlr:prepare
      - run: npm run parser:antlr:build
      - name: Run selected PostgreSQL or parser tests with the shared web build
        run: node scripts/ci-focused-tests.mjs --run
        env:
          CI_TEST_FILES: ${{ toJSON(matrix.files) }}

  # Always report a stable, fail-closed gate, including a deliberate no-test diff.
  product:
    if: always()
    needs: [changes, focused]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      TESTS_NEEDED: ${{ needs.changes.outputs.needed }}
      FOCUSED_RESULT: ${{ needs.focused.result }}
    steps:
      - name: Require a successful selection and every relevant test
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$TESTS_NEEDED" = true ]; then
            test "$FOCUSED_RESULT" = success
          else
            test "$TESTS_NEEDED" = false
            test "$FOCUSED_RESULT" = skipped
          fi
