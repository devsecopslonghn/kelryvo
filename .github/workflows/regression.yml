name: Kelryvo full product regression

on:
  schedule:
    - cron: '17 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned native and WASM toolchains
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - name: Install native test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev pkg-config postgresql-16
      - run: |
          cargo fetch --locked
          cargo check-delivery
      - run: cargo test --locked -p kelryvo-parser --test corpus -p kelryvo-oracle-grammar --test corpus

  acceptance:
    strategy:
      fail-fast: false
      matrix:
        suite: [api, browser, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned native and WASM toolchains
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - name: Install native test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev pkg-config postgresql-16
      - name: Install pinned WASM bundler
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - if: matrix.suite == 'browser'
        name: Install the reviewed browser prerequisites and pinned native browser
        run: |
          sudo apt-get update
          # Retain the Ubuntu 24.04 Chromium/tool package set from the reviewed
          # Playwright 1.64.0 native dependency inventory; no Node driver runs.
          sudo apt-get install -y --no-install-recommends \
            xvfb fonts-noto-color-emoji fonts-unifont libfontconfig1 libfreetype6 \
            xfonts-cyrillic xfonts-scalable fonts-liberation fonts-ipafont-gothic \
            fonts-wqy-zenhei fonts-tlwg-loma-otf fonts-freefont-ttf \
            libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64 libatspi2.0-0t64 \
            libcairo2 libcups2t64 libdbus-1-3 libdrm2 libgbm1 libglib2.0-0t64 \
            libnspr4 libnss3 libpango-1.0-0 libx11-6 libxcb1 libxcomposite1 \
            libxdamage1 libxext6 libxfixes3 libxkbcommon0 libxrandr2
          cargo run --locked -p kelryvo-test-tools --bin kelryvo-test -- --install-browser
      - name: Native integration, browser or distribution acceptance
        env:
          TEST_SUITE: ${{ matrix.suite }}
          KELRYVO_REVISION: ${{ github.sha }}
        run: |
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          cargo run --locked -p kelryvo-test-tools --bin kelryvo-test -- --ci regression
      - if: failure() && matrix.suite == 'browser'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-browser-failure-${{ github.run_attempt }}
          path: .cache/rust-browser-*/failure.png
          if-no-files-found: ignore
          retention-days: 7

  product:
    if: always()
    needs: [offline, acceptance]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      ACCEPTANCE_RESULT: ${{ needs.acceptance.result }}
      OFFLINE_RESULT: ${{ needs.offline.result }}
    steps:
      - run: |
          test "$OFFLINE_RESULT" = success
          test "$ACCEPTANCE_RESULT" = success
