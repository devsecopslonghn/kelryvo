name: Kelryvo full product regression

on:
  schedule:
    - cron: '17 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '4'

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/native-rust
        with:
          key: foundation
      - name: Install native test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev pkg-config postgresql-16
      - run: |
          cargo fetch --locked
          cargo check-delivery
      - run: cargo test --locked -p kelryvo-parser --test corpus -p kelryvo-oracle-grammar --test corpus

  api:
    strategy:
      fail-fast: false
      matrix:
        group: [core-parser, operator, server, worker, tools]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/native-rust
        with:
          key: source-tests-${{ matrix.group }}
      - name: Install native test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev pkg-config postgresql-16
      - name: Retain all API and source checks in independent private clusters
        env:
          TEST_GROUP: ${{ matrix.group }}
        run: |
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          cargo native-test --ci-tests "$TEST_GROUP"

  acceptance:
    strategy:
      fail-fast: false
      matrix:
        suite: [browser-access, browser-metadata, browser-schema, browser-composite, browser-auth, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/native-rust
        with:
          # The runtime baseline contains the same native application graph.
          # Cargo independently checks freshness before every suite executes.
          key: native-runtime
      - name: Install native test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev pkg-config postgresql-16
      - if: startsWith(matrix.suite, 'browser-')
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .cache/native-browser/chrome-linux64-*.zip
          key: native-browser-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('docs/dependencies/test-browser.json') }}
      - if: startsWith(matrix.suite, 'browser-')
        name: Install the reviewed browser prerequisites and pinned native browser
        run: |
          sudo apt-get update
          # Reviewed Ubuntu 24.04 libraries for the pinned external Chromium.
          sudo apt-get install -y --no-install-recommends \
            xvfb fonts-noto-color-emoji fonts-unifont libfontconfig1 libfreetype6 \
            xfonts-cyrillic xfonts-scalable fonts-liberation fonts-ipafont-gothic \
            fonts-wqy-zenhei fonts-tlwg-loma-otf fonts-freefont-ttf \
            libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64 libatspi2.0-0t64 \
            libcairo2 libcups2t64 libdbus-1-3 libdrm2 libgbm1 libglib2.0-0t64 \
            libnspr4 libnss3 libpango-1.0-0 libx11-6 libxcb1 libxcomposite1 \
            libxdamage1 libxext6 libxfixes3 libxkbcommon0 libxrandr2
          cargo run --locked -p kelryvo-test-tools --bin kelryvo-test -- --install-browser
      - name: Native integration, browser or distribution acceptance
        env:
          TEST_SUITE: ${{ matrix.suite }}
          KELRYVO_REVISION: ${{ github.sha }}
        run: |
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          cargo run --locked -p kelryvo-test-tools --bin kelryvo-test -- --ci regression
      - if: failure() && startsWith(matrix.suite, 'browser-')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-browser-failure-${{ matrix.suite }}-${{ github.run_attempt }}
          path: .cache/rust-browser-*/failure.png
          if-no-files-found: ignore
          retention-days: 7

  product:
    if: always()
    needs: [offline, api, acceptance]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      ACCEPTANCE_RESULT: ${{ needs.acceptance.result }}
      API_RESULT: ${{ needs.api.result }}
      OFFLINE_RESULT: ${{ needs.offline.result }}
    steps:
      - run: |
          test "$OFFLINE_RESULT" = success
          test "$API_RESULT" = success
          test "$ACCEPTANCE_RESULT" = success
