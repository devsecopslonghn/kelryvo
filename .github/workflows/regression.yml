name: Kelryvo full product regression

on:
  schedule:
    - cron: '17 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned native and WASM toolchains
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - name: Install native test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev pkg-config postgresql-16
      - run: npm run check:delivery
      - run: npm run parser:corpus

  acceptance:
    strategy:
      fail-fast: false
      matrix:
        suite: [api, browser, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned native and WASM toolchains
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - name: Install native test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev pkg-config postgresql-16
      - name: Install pinned WASM bundler
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - if: matrix.suite == 'browser'
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Native integration, browser or distribution acceptance
        env:
          TEST_SUITE: ${{ matrix.suite }}
          KELRYVO_REVISION: ${{ github.sha }}
        run: |
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          case "$TEST_SUITE" in
            api) bash scripts/test-rust.sh ;;
            browser) bash scripts/test-rust.sh --browser-only ;;
            release) bash scripts/test-rust.sh --oci-only; bash scripts/test-rust.sh --runtime-only ;;
            *) exit 1 ;;
          esac
      - if: failure() && matrix.suite == 'browser'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-browser-failure-${{ github.run_attempt }}
          path: .cache/rust-browser-*/failure.png
          if-no-files-found: ignore
          retention-days: 7

  product:
    if: always()
    needs: [offline, acceptance]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      ACCEPTANCE_RESULT: ${{ needs.acceptance.result }}
      OFFLINE_RESULT: ${{ needs.offline.result }}
    steps:
      - run: |
          test "$OFFLINE_RESULT" = success
          test "$ACCEPTANCE_RESULT" = success
