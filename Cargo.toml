[workspace]
members = ["crates/kelryvo-core", "crates/kelryvo-fixtures", "crates/kelryvo-cli", "crates/kelryvo-parser", "crates/kelryvo-server", "crates/kelryvo-web", "crates/kelryvo-vault", "crates/kelryvo-runtime", "crates/kelryvo-operator", "crates/kelryvo-worker", "crates/kelryvo-launcher", "crates/kelryvo-discovery", "crates/kelryvo-oracle-grammar", "crates/kelryvo-test-tools"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license-file = "LICENSE"
publish = false

[workspace.dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10"
openssl = "0.10"
zeroize = "1"

[profile.release]
# Keep optimized release artifacts, with independent code generation so the
# five native programs do not repeat whole-program LTO on every source SHA.
lto = false
codegen-units = 16
strip = "debuginfo"

# CI verifiers hash complete native distributions and OCI layers. Keep SHA-256
# optimized while retaining the development/test assertions of their callers.
[profile.dev.package.sha2]
opt-level = 3

# Exercise the unchanged production scrypt parameters within browser deadlines.
# Unoptimized Salsa20 rounds otherwise dominate the native password fixtures.
[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
