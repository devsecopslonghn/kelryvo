[workspace]
members = ["crates/kelryvo-core", "crates/kelryvo-cli", "crates/kelryvo-parser", "crates/kelryvo-server", "crates/kelryvo-web", "crates/kelryvo-vault", "crates/kelryvo-runtime", "crates/kelryvo-operator", "crates/kelryvo-worker", "crates/kelryvo-launcher", "crates/kelryvo-discovery", "crates/kelryvo-oracle-grammar", "crates/kelryvo-test-tools"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license-file = "LICENSE"
publish = false

[workspace.dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10"
openssl = "0.10"
zeroize = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
