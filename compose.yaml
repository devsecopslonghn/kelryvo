services:
  kelryvo:
    image: ${KELRYVO_IMAGE:?Set KELRYVO_IMAGE to a pinned kelryvo-app repository@sha256 digest}
    user: "0:0"
    entrypoint: ["/opt/kelryvo/bin/kelryvo-runtime"]
    init: false
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, KILL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /run/kelryvo/runtime:rw,nosuid,noexec,size=64m,mode=0711
      - /tmp:rw,nosuid,noexec,size=64m,mode=1777
    environment:
      KELRYVO_SECRET_DIR: /run/kelryvo/secrets
      KELRYVO_INSTALLATION_DIR: /run/kelryvo/installation
      KELRYVO_BIND_HOST: 0.0.0.0
      KELRYVO_PORT: "8443"
      KELRYVO_EXECUTION_ENABLED: ${KELRYVO_EXECUTION_ENABLED:-false}
      KELRYVO_DISCOVERY_ENABLED: ${KELRYVO_DISCOVERY_ENABLED:-false}
    volumes:
      - type: bind
        source: ${KELRYVO_SECRET_DIRECTORY:?Set KELRYVO_SECRET_DIRECTORY to a root-owned private Secret directory}
        target: /run/kelryvo/secrets
        read_only: true
        bind:
          create_host_path: false
    ports:
      - target: 8443
        published: ${KELRYVO_HOST_PORT:-8443}
        host_ip: 127.0.0.1
        protocol: tcp
    mem_limit: 768m
    networks:
      - database

networks:
  database:
    name: ${KELRYVO_NETWORK:-kelryvo}
