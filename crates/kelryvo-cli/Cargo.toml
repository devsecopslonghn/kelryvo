[package]
name = "kelryvo-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file = "../../LICENSE"
publish.workspace = true
default-run = "kelryvo"

[lib]
path = "src/lib.rs"

[[bin]]
name = "kelryvo"
path = "src/main.rs"

[[bin]]
name = "kelryvo-repository"
path = "src/repository/main.rs"

[dependencies]
kelryvo-fixtures = { path = "../kelryvo-fixtures" }
chrono.workspace = true
kelryvo-core = { path = "../kelryvo-core" }
kelryvo-parser = { path = "../kelryvo-parser" }
serde_json.workspace = true
sha2.workspace = true
tempfile = "3.27"
toml = "0.9"
libc = "0.2"
tar = { version = "0.4.46", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1", features = ["rt", "macros", "time", "net", "io-util", "process"] }
zeroize.workspace = true
base64.workspace = true
regex.workspace = true
ryu-js = "=1.0.3"
yaml-rust2 = { version = "=0.10.4", default-features = false }
nix = { version = "0.30", default-features = false, features = ["signal", "process"] }

[lints]
workspace = true
