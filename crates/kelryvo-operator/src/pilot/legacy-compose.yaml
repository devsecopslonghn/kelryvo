name: kelryvo-pilot
services:
  postgresql:
    image: postgres:17.10-bookworm@sha256:9b18b78397054fce88a9552e9d5a3ad5bb7fd258c5b3cc1c5028e46373d6ea8f
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: kelryvo
      POSTGRES_PASSWORD_FILE: /run/kelryvo/postgresql/admin-password
    volumes:
      - metadata:/var/lib/postgresql/data
      - ${KELRYVO_HOME:?Run scripts/pilot.py init}/postgresql:/run/kelryvo/postgresql:ro
      - ${KELRYVO_HOME}/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d kelryvo']
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [metadata]
  kelryvo:
    image: ${KELRYVO_IMAGE:?Set the verified release image}
    restart: unless-stopped
    depends_on:
      postgresql: {condition: service_healthy}
    user: '0:0'
    entrypoint: [/opt/kelryvo/bin/kelryvo-runtime]
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, KILL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /run/kelryvo/runtime:rw,nosuid,noexec,size=64m,mode=0711
      - /tmp:rw,nosuid,noexec,size=64m,mode=1777
    environment:
      KELRYVO_SECRET_DIR: /run/kelryvo/secrets
      KELRYVO_EXECUTION_ENABLED: 'false'
      KELRYVO_DISCOVERY_ENABLED: 'false'
    volumes:
      - ${KELRYVO_HOME}/secrets:/run/kelryvo/secrets:ro
      - ${KELRYVO_HOME}/repositories:/run/kelryvo/repositories:ro
    ports: ['127.0.0.1:${KELRYVO_HOST_PORT:-8443}:8443']
    mem_limit: 1g
    networks: [metadata, frontend]
volumes:
  metadata:
networks:
  frontend: {}
  metadata:
    internal: true
