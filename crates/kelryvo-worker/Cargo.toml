[package]
name = "kelryvo-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file = "../../LICENSE"
publish.workspace = true

[dependencies]
kelryvo-runtime = { path = "../kelryvo-runtime" }
kelryvo-core = { path = "../kelryvo-core" }
kelryvo-launcher = { path = "../kelryvo-launcher" }
kelryvo-discovery = { path = "../kelryvo-discovery" }
kelryvo-server = { path = "../kelryvo-server" }
kelryvo-parser = { path = "../kelryvo-parser" }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
libc = "0.2"
zeroize.workspace = true
sha2.workspace = true
rand = "0.8"
nix = { version = "0.30", default-features = false, features = ["fs","user"] }
url = "2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
base64.workspace = true
regex.workspace = true
axum = "0.8"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
